; ==============================================================================
; FEDERAÇÃO PERNAMBUCANA DE FOOT TABLE (FPEFT)
; CONFIGURAÇÃO DE SEGURANÇA E HARDENING DO INTERPRETADOR PHP (php.ini)
; ==============================================================================

; 1. Desativação de Funções Perigosas do Sistema Operacional (Anti-RCE)
disable_functions = exec,passthru,shell_exec,system,proc_open,popen,curl_multi_exec,parse_ini_file,show_source,eval,pcntl_exec,dl,popen

; 2. Ocultação de Informações e Assinatura do PHP
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

; 3. Bloqueio de Inclusão Remota de Arquivos (Anti-RFI / LFI)
allow_url_fopen = Off
allow_url_include = Off

; 4. Blindagem de Sessão HTTP
session.use_strict_mode = 1
session.use_only_cookies = 1
session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = "Lax"
session.gc_maxlifetime = 3600
session.sid_length = 48
session.sid_bits_per_character = 6

; 5. Limites de Recursos e Prevenção contra DoS
memory_limit = 128M
max_execution_time = 30
max_input_time = 30
post_max_size = 8M
upload_max_filesize = 5M
max_file_uploads = 5

; 6. Segurança de Uploads
file_uploads = On
upload_tmp_dir = /tmp
